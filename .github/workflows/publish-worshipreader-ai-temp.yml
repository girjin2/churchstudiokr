name: Publish WorshipReader Sermon UI APK
on:
  push:
    paths:
      - '.github/workflows/publish-worshipreader-ai-temp.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Android artifact
        run: |
          curl -fL 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-2c58-822f-b8a5-43ff6f9c6a3e/raw?se=2026-09-16T09%3A29%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=c437b336-7460-51a4-baab-ef0cb5918012&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T23%3A04%3A32Z&ske=2026-09-16T23%3A04%3A32Z&sks=b&skv=2026-02-06&sig=WhoyorMUJeLEQqvwC721IaPLrwkag1xwtHM8kythiCw%3D' -o artifact.zip
          unzip -q artifact.zip
          test "$(sha256sum WorshipReader-Android.apk | awk '{print $1}')" = "4805f1845e2e1930759e39c7753aafd650d58b1c5643f1baf018e2eaddcc6df4"
          test "$(stat -c%s WorshipReader-Android.apk)" = "4878993"
      - name: Replace stable release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload worship-reader-android WorshipReader-Android.apk --clobber --repo girjin2/churchstudiokr
          gh release view worship-reader-android --repo girjin2/churchstudiokr --json assets
