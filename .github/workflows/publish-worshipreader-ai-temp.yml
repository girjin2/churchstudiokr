name: Publish WorshipReader Sermon Paste APK
on:
  push:
    paths:
      - '.github/workflows/publish-worshipreader-ai-temp.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Android artifact
        run: |
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-9e00-81f5-98a8-f8d411161258/raw?se=2026-09-16T10%3A07%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=bf614df3-1dd4-5bfa-81d8-db9403219764&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T01%3A42%3A53Z&ske=2026-09-17T01%3A42%3A53Z&sks=b&skv=2026-02-06&sig=p7lPPFbevcl01N546Y2IQx8KcPNOkFRHhoxB2ssLnvM%3D' -o artifact.zip
          unzip -q artifact.zip
          test "$(sha256sum WorshipReader-Android.apk | awk '{print $1}')" = "1200f3ea887703145040ce3db18b048851460eae90a7f218990371b1bb02bdad"
          test "$(stat -c%s WorshipReader-Android.apk)" = "4878985"
      - name: Replace stable release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload worship-reader-android WorshipReader-Android.apk --clobber --repo girjin2/churchstudiokr
          gh release view worship-reader-android --repo girjin2/churchstudiokr --json assets
