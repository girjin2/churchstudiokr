name: Backup ChurchStudio website source to Google Drive

# This workflow stores source snapshots directly in Google Drive, not Actions artifacts.
# Required Actions secret: GDRIVE_RCLONE_CONFIG (full rclone.conf with a [gdrive] remote).
# Never commit any OAuth token, rclone.conf, credentials, or .env file.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdrive-backup-churchstudiokr
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the committed source
        uses: actions/checkout@v4

      - name: Create versioned source ZIP and SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/churchstudio-drive-backup"
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          base="churchstudiokr-${timestamp}-${short_sha}-${GITHUB_RUN_ID}"
          out="$RUNNER_TEMP/churchstudio-drive-backup"
          git archive --format=zip --output="$out/$base.zip" HEAD
          (
            cd "$out"
            sha256sum "$base.zip" > "$base.zip.sha256"
          )
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'created_utc=%s\n' "$timestamp"
            printf 'archive=%s\n' "$base.zip"
          } > "$out/$base.manifest.txt"

      - name: Install rclone
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Configure Drive from protected repository secret
        shell: bash
        env:
          DRIVE_CONFIG_SECRET: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$DRIVE_CONFIG_SECRET" ]; then
            echo "::error::Missing GitHub Actions secret GDRIVE_RCLONE_CONFIG. Configure Google Drive OAuth first."
            exit 1
          fi
          config_file="$RUNNER_TEMP/rclone.conf"
          (umask 077; printf '%s' "$DRIVE_CONFIG_SECRET" > "$config_file")
          printf 'RCLONE_CONFIG=%s\n' "$config_file" >> "$GITHUB_ENV"
          # The secret must define [gdrive]; never print the config itself.
          if ! grep -qx '\[gdrive\]' "$config_file"; then
            echo "::error::Secret must contain an rclone remote named [gdrive]."
            exit 1
          fi

      - name: Upload to the existing Google Drive backup folder
        shell: bash
        env:
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: '19l7ZDnWnaTEffsMGSsMNZ7YizUXxN7dM'
        run: |
          set -euo pipefail
          rclone copy "$RUNNER_TEMP/churchstudio-drive-backup" gdrive: \
            --checkers 4 --transfers 2 --retries 3 --low-level-retries 6
          # Download-based verification avoids relying on Drive's advertised hash.
          rclone check "$RUNNER_TEMP/churchstudio-drive-backup" gdrive: \
            --download --one-way --checkers 2
          echo "Google Drive source snapshot upload and verification completed."
