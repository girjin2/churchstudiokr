name: Publish WorshipReader Size Controls
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-reader-ppt-layout-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reassemble verified APK from 19 staged chunks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          chunk_shas=(
            f69be904b4d41324b80ed5f021843f4bf80f3de4
            7ef889508aa9e5c2515378263f1738de1785b793
            92be9bea1e3c84994dbec06f82721fe58cf20541
            651677212903a9d8890ea3a0ea9e6e2305e9a1df
            4a8242defff09c75d78e397cc5913e886cf8a145
            b76c8bdfcbb814b5d884c8dc9b38f5aa5169ae49
            a52a5699a8b0c0e9ebb7fb858e5fee48474f88d6
            08e5b5f6fb5d322e0c7e1ebf07a5c5cc11b09f5c
            9905eb6fdef143e9c9078588edb1ebc125bc2cad
            1152e844785d247f2c548a3c86d9ff261cec3790
            a1b5a0e748325cffb46f3e3cee036151685bd8b2
            7b9f7706063b5c66195b0f2098bead28d680537b
            d0f1d0221f545bd829e638c93a9bb57ef1893d7c
            43e01a7c66a7b9cdb295ec6a356fc47c7ba34c94
            fe9cf9688d988e6014c1494c0ec02574e5b24312
            2f95ae0a5148843427302a8deac92347a1e6e88b
            533ff7bd0bf0c7a161b0755d7e42588a327539e7
            a18d516076f2615e8da0aa1f5d1086a8936acb03
            10603087c686b6677ed7a3840e8e53001456f01b
          )
          for i in "${!chunk_shas[@]}"; do
            blob="${chunk_shas[$i]}"
            part="$(printf 'publish/chunk%03d' "$i")"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' |
              base64 --decode | base64 --decode > "$part"
            if [ "$i" -lt 18 ]; then
              test "$(stat -c%s "$part")" -eq 262144
            else
              test "$(stat -c%s "$part")" -eq 162293
            fi
            test "$(base64 -w0 "$part" | git hash-object --stdin)" = "$blob"
          done
          cat publish/chunk??? > publish/WorshipReader-Android.apk
          test "$(stat -c%s publish/WorshipReader-Android.apk)" -eq 4880885
          echo 'ad489dec8141630ab8fa537f74bd584522ff7548e1a1874c0b2991f63b65aebf  publish/WorshipReader-Android.apk' | sha256sum -c -
          unzip -tq publish/WorshipReader-Android.apk | tail -1
          (cd publish && sha256sum WorshipReader-Android.apk > SHA256SUMS.txt)
      - name: Publish fixed APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='worshipreader-size-controls-20261022'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" publish/WorshipReader-Android.apk publish/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" publish/WorshipReader-Android.apk publish/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'WorshipReader Android - PPT text size & zoom controls (2026-10-22)' \
              --notes 'Built from girjin2/ChurchStudioreader commit afe87d92b2c19b1ff0aaf546bb7d94442c26ff35. Adds always-visible font-size controls (16-80px) in PPT text view and 75-300% zoom for original slides, plus reset and mobile scrolling. Retains prior PPT layout fixes. Automated tests and APK ZIP integrity passed. Physical device and original user file still require validation. SHA-256: ad489dec8141630ab8fa537f74bd584522ff7548e1a1874c0b2991f63b65aebf.'
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets
