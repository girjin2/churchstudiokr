name: Publish compact-control WorshipReader APK once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-reader-compact-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified WorshipReader artifact
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-24c4-81f8-ac3a-a76f9ec0c0cd/raw?se=2026-09-13T04%3A28%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=cd7a0bb0-8185-51c3-9002-f243a63c8b55&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T23%3A34%3A50Z&ske=2026-09-13T23%3A34%3A50Z&sks=b&skv=2026-02-06&sig=XQ2pJ1cmG338p1HGOMy7kSs7c%2Bl9zvLAIKXQnzmwnPc%3D' -o artifact.zip
          unzip -q artifact.zip
          test -f WorshipReader-Android.apk
          echo '7340aac1f8ad54b1a13300ee81bdb0f05d500151baf663b295bf6b42df935d39  WorshipReader-Android.apk' | sha256sum -c -
      - name: Replace public release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload worship-reader-android WorshipReader-Android.apk --clobber
