name: Publish WorshipReader edit APK temp
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified artifact
        run: |
          curl -fL --retry 3 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-9a24-8211-9015-7330587f08f6/raw?se=2026-09-16T02%3A27%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=fedd5a81-27ed-586d-a041-390c66132f05&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T00%3A41%3A05Z&ske=2026-09-17T00%3A41%3A05Z&sks=b&skv=2026-02-06&sig=SkdJqohz%2B8r9OEy6Wi2M%2BoYZuc0RZSfN7LC0/lXCmLo%3D' -o artifact.zip
          unzip -o artifact.zip
          APK=$(find . -maxdepth 3 -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" WorshipReader-Android.apk
      - name: Verify exact APK
        run: |
          test "$(stat -c%s WorshipReader-Android.apk)" = "4878041"
          echo '97a0f44e2c57e567e2d15b83bc42d04e77353856b8720396cb0589ad75d26765  WorshipReader-Android.apk' | sha256sum -c -
      - name: Replace stable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload worship-reader-android WorshipReader-Android.apk --clobber --repo girjin2/churchstudiokr
