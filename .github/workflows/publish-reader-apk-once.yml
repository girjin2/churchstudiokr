name: Publish WorshipReader APK Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-reader-apk-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified WorshipReader artifact
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntpreastus.oaiusercontent.com/files/00000000-4514-81f9-9065-431ae2097b99/raw?se=2026-09-13T03%3A19%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=7ed432d4-26e5-59a6-b395-765c484e511d&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T21%3A21%3A46Z&ske=2026-09-13T21%3A21%3A46Z&sks=b&skv=2026-02-06&sig=4T8y0kxB0ygneGDiNbUfBIo6IxTMVnz8T6cMVxfUE4w%3D' -o artifact.zip
          unzip -q artifact.zip
          test -f WorshipReader-Android.apk
          echo 'faf1e49ba0851a3d469072486585fd5980abca699767e535a031768249819c6b  WorshipReader-Android.apk' | sha256sum -c -
      - name: Replace public release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload worship-reader-android WorshipReader-Android.apk --clobber
