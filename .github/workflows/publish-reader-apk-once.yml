name: Publish WorshipReader APK Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-reader-apk-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild updated APK from public base
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://github.com/girjin2/churchstudiokr/releases/download/worship-reader-android/WorshipReader-Android.apk' -o old.apk
          echo 'f261a7e344a30b36190d805d59920f7b6acd1cae05a08d4fbd4b06f52fd277fe  old.apk' | sha256sum -c -
          mkdir work
          unzip -q old.apk -d work
          zstd -q -d --patch-from=work/assets/public/assets/index-BzeRPWdT.js patches/index.patch.zst -o work/assets/public/assets/index-BIzxETKh.js
          zstd -q -d --patch-from=work/assets/public/assets/index-BjutxRyx.css patches/css.patch.zst -o work/assets/public/assets/index-DGukrboM.css
          zstd -q -d --patch-from=work/assets/public/assets/pdf-D3pbnjY3.js patches/pdf.patch.zst -o work/assets/public/assets/pdf-BeQF-R1U.js
          zstd -q -d --patch-from=work/assets/public/index.html patches/html.patch.zst -o work/assets/public/index.html.new
          zstd -q -d --patch-from=work/classes6.dex patches/classes.patch.zst -o work/classes6.dex.new
          mv work/assets/public/index.html.new work/assets/public/index.html
          mv work/classes6.dex.new work/classes6.dex
          rm -f work/assets/public/assets/index-BzeRPWdT.js work/assets/public/assets/index-BjutxRyx.css work/assets/public/assets/pdf-D3pbnjY3.js
          rm -rf work/META-INF
          echo '3dfe32fb906a27969b1b0348a6f6553d64cf661efcb0c81b72acf18e55ce0ec9  work/assets/public/assets/index-BIzxETKh.js' | sha256sum -c -
          echo '024c4e64f875bf4804ebcaf6bb87e1df164d206859b1c8047ad9809c43ba082a  work/assets/public/assets/index-DGukrboM.css' | sha256sum -c -
          echo '6c67fe7e47aafa378241d672adb82fe169ce3bd2196dd825765010dfd0cfad57  work/assets/public/assets/pdf-BeQF-R1U.js' | sha256sum -c -
          echo '54262fd6de8eb0e178aad94b06ec851cd38fe6cb1227e25d0244f8e88e6abdf9  work/assets/public/index.html' | sha256sum -c -
          echo 'c70f2ef17bd0c64a6eae807265512e1dc4c709f773454a190f1a9b5837611724  work/classes6.dex' | sha256sum -c -
          (cd work && zip -q -r ../unsigned.apk .)
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -noprompt -keystore publish-debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=ChurchStudio,C=KR'
          "$BT/apksigner" sign --ks publish-debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out WorshipReader-Android.apk aligned.apk
          "$BT/apksigner" verify --verbose WorshipReader-Android.apk
      - name: Replace public release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload worship-reader-android WorshipReader-Android.apk --clobber
